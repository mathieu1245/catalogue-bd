<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#007AFF">
  <title>Ma Collection</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  
  
  
  
  
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-box">
      <h2 id="auth-title">Connexion</h2>
      <p>Collections BD, LEGO, Santons &amp; Véhicules</p>
      <div id="auth-error" class="auth-error"></div>
      <form id="auth-form">
        <div class="form-group"><label>Email</label><input type="email" id="auth-email" required></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="auth-password" required></div>
        <button type="submit" id="auth-submit-btn" class="btn btn-primary">Se connecter</button>
      </form>
      <p style="margin-top:14px;margin-bottom:0;"><a href="#" id="toggle-auth-mode" style="color:#007AFF;">Créer un compte</a></p>
    </div>
  </div>
  <div id="app-screen" style="display:none;">
    <header class="header">
      <div class="header-top"><h1>Ma Collection</h1><div style="display:flex;gap:8px;align-items:center;"><select id="active-personne" style="width:auto;font-weight:600;"></select><button id="btn-logout" class="btn-logout">Quitter</button></div></div>
      <div class="filters-grid">
        <select id="filter-categorie">
          <option value="all">🏷️ Toutes catégories</option>
          <option value="bd">📚 BD</option>
          <option value="lego">🧱 LEGO</option>
          <option value="santon">🏺 Santons</option>
          <option value="vehicule">🚗 Véhicules</option>
        </select>
        
      </div>
      <div class="filters-row"><input type="text" id="new-personne-input" placeholder="Nouvelle personne..." style="flex:1;padding:8px 10px;border-radius:8px;border:none;"><button type="button" id="btn-add-personne" class="btn-manage">+ Ajouter</button></div>
    </header>
    <div class="search-bar"><input type="search" id="search-input" placeholder="🔍 Rechercher titre, set, auteur, santonnier, réf..."></div>
    <main id="items-container" class="content"></main>
    <button id="btn-fab-add" class="fab">+</button>
  </div>
  <div id="modal-add" class="modal">
    <div class="modal-content">
      <div class="modal-header"><h2>Ajouter un objet</h2><button class="close-btn" data-close="modal-add">&times;</button></div>
      <form id="form-add-item">
        <div class="filters-grid">
          <div class="form-group"><label>Catégorie *</label>
            <select id="item-categorie">
              <option value="bd">📚 BD</option><option value="lego">🧱 LEGO</option>
              <option value="santon">🏺 Santon</option><option value="vehicule">🚗 Véhicule</option>
            </select>
          </div>
          <div class="form-group"><label>Personne</label><input type="text" id="item-personne" value="Moi"></div>
        </div>
        <div id="scanner-box" class="scan-zone">
          <h3>📷 Scanner ou rechercher (BD / LEGO)</h3>
          <div class="btn-row">
            <button type="button" id="btn-start-scan" class="btn btn-secondary" style="margin-top:0;">Caméra</button>
            <button type="button" id="btn-scan-photo" class="btn btn-secondary" style="margin-top:0;">🖼️ Photo</button>
            <button type="button" id="btn-stop-scan" class="btn btn-danger" style="margin-top:0;display:none;">Stop</button>
          </div>
          <input type="file" id="input-scan-photo" accept="image/*" capture="environment" style="display:none;">
          <div id="reader-container"></div><div id="reader-hidden" style="display:none;"></div>
          <div id="api-search-zone" class="btn-row" style="margin-top:10px;">
            <input type="text" id="api-query-input" placeholder="ISBN, titre ou numéro de set...">
            <button type="button" id="btn-api-search" class="btn btn-primary" style="width:auto;margin-top:0;padding:0 16px;">🔍</button>
          </div>
        </div>
        <div id="web-link-box" class="scan-zone">
          <h3>🔗 Importer photo &amp; infos depuis un lien web</h3>
          <div class="btn-row">
            <input type="url" id="web-url-input" placeholder="Lien de la fiche produit ou de l'image...">
            <button type="button" id="btn-fetch-url" class="btn btn-primary" style="width:auto;margin-top:0;padding:0 14px;">Importer</button>
          </div>
        </div>
        <div id="scan-status" class="scan-status"></div>
        <div id="search-results" class="search-results"></div>
        
        <div class="form-group"><label>Titre / Nom *</label><input type="text" id="item-titre" required></div>
        <div class="filters-grid">
          <div class="form-group"><label>Série / Thème</label><input type="text" id="item-serie"></div>
          <div class="form-group"><label id="label-numero">Numéro</label><input type="text" id="item-numero"></div>
        </div>
        <div class="filters-grid">
          <div class="form-group"><label id="label-auteur">Auteur / Santonnier / Fabricant</label><input type="text" id="item-auteur"></div>
          <div class="form-group"><label id="label-editeur">Éditeur / Marque</label><input type="text" id="item-editeur"></div>
        </div>
        <div class="filters-grid">
          <div class="form-group"><label>Année</label><input type="text" id="item-annee"></div>
          <div class="form-group"><label id="label-ref">Code-barres / Référence</label><input type="text" id="item-code-barre"></div>
        </div>
        <div class="form-group">
          <label>Photo manuelle (appareil photo ou URL directe)</label>
          <input type="file" id="item-photo-file" accept="image/*" capture="environment">
          <input type="url" id="item-photo-url" placeholder="Ou collez l'URL https://... de la photo" style="margin-top:6px;">
          <img id="item-photo-preview" class="image-preview" alt="">
        </div>
        <div class="form-group"><label>Description / Notes</label><textarea id="item-notes" rows="3"></textarea></div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </form>
    </div>
  </div>
  <div id="modal-detail" class="modal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="detail-title">Détails</h2><button class="close-btn" data-close="modal-detail">&times;</button></div>
      <div id="detail-body"></div>
      <button id="btn-delete-item" class="btn btn-danger">Supprimer cet objet</button>
    </div>
  </div>
  <script src="scanner.js"></script><script src="bd.js"></script><script src="lego.js"></script><script src="web-scraper.js"></script><script src="app.js"></script>
</body>
</html>
